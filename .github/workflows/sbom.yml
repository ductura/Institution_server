name: SBOM i provjera produkcijskog builda
on:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  sbom:
    name: CycloneDX i build bez source mapa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Izradi SBOM iz zaključanih produkcijskih ovisnosti
        # pnpm 11 provides the SBOM command. Installs and builds still use the repo's pnpm pin.
        run: |
          npm exec --yes --package=pnpm@11.28.13 -- pnpm --pm-on-fail=ignore sbom \
            --filter @ductura/institution-server --sbom-format cyclonedx --sbom-type application \
            --prod --lockfile-only --out "$RUNNER_TEMP/sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: institution-server-sbom
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Provjeri da build odbija .map datoteku
        run: |
          mkdir -p dist/source-map-check
          probe=dist/source-map-check/probe.js.map
          trap 'rm -f -- "$probe"' EXIT
          touch "$probe"
          if pnpm build > "$RUNNER_TEMP/build-with-map.log" 2>&1; then
            echo 'Build je prihvatio .map datoteku.' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/build-with-map.log"
          grep -F 'Production build contains source maps: source-map-check/probe.js.map' "$RUNNER_TEMP/build-with-map.log"
