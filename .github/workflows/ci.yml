name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# DAN-721: scope picks the jobs from the changed paths, ci-ok is the one
# aggregate status. Both run scripts/ci from protected main (the PR base), never
# from the PR head, so a PR cannot skip its own database job. A base without
# scripts/ci (bootstrap) runs everything and requires every job to succeed.
jobs:
  scope:
    name: Opseg CI-ja
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Razvrstavanje promjena
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] || [ "$PR_BASE_REF" != main ]; then
            echo 'profile=full' >> "$GITHUB_OUTPUT"
          elif [ ! -f scripts/ci/scope.ts ] || [ -L scripts/ci/scope.ts ]; then
            echo 'profile=full' >> "$GITHUB_OUTPUT"
          else
            [[ "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$PR_HEAD"
            node scripts/ci/scope.ts >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Provjere i testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provjera tipova
        run: pnpm typecheck
      # D-91 (1), S-0.13: db/main/migrations.sum matches the files, and no
      # migration of the base (PR base, or main before this push) changed or
      # disappeared. On a PR the checkout is the merge commit, so main's newer
      # migrations count. Ported from the Ductus step "Migration ledger (D-91)".
      - name: Knjiga migracija (D-91)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE"; elif [ "$EVENT_NAME" = push ]; then base="$PUSH_BEFORE"; fi
          if [ -n "$base" ]; then
            [[ "$base" =~ ^[a-f0-9]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$base"
            node scripts/db/migrations-ledger.ts --base "$base"
          else
            node scripts/db/migrations-ledger.ts
          fi
      - name: Lint
        run: pnpm lint
      - name: Formatiranje
        run: pnpm format:check
      - name: Unit testovi
        run: pnpm test:unit
      - name: Svojstveni testovi
        run: pnpm test:property
      - name: Integracijski testovi
        run: pnpm test:integration
      - name: Zaštita od lomljenja ugovora
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          pnpm contracts:breaking FETCH_HEAD

  database:
    name: PostgreSQL i pgTAP
    needs: scope
    if: needs.scope.outputs.profile == 'full'
    runs-on: ubuntu-latest
    env:
      PGBIN: /usr/lib/postgresql/17/bin
      PGPORT: "5499"
      PGUSER: postgres
      PGDATABASE: ductura_ci
      DUCTUS_NATIVE_PGPORT: "5498"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalacija PostgreSQL-a (PGDG)
        env:
          PGDG_KEY_FINGERPRINT: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | grep -qx "fpr:::::::::$PGDG_KEY_FINGERPRINT:"
          sudo install -D -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-17 postgresql-17-pgtap libtap-parser-sourcehandler-pgtap-perl
      - name: Pokretanje baze
        run: |
          echo "PGHOST=$RUNNER_TEMP" >> "$GITHUB_ENV"
          export PGHOST="$RUNNER_TEMP"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U postgres --auth=trust --encoding=UTF8 --locale=C.UTF-8
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -w start \
            -o "-p $PGPORT -k $RUNNER_TEMP -c listen_addresses=''"
          "$PGBIN/createdb" ductura_ci
          "$PGBIN/psql" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgtap'
      - name: pgTAP testovi
        run: |
          shopt -s nullglob
          files=(db/tests/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then echo 'No pgTAP test files found.' >&2; exit 1; fi
          pg_prove --psql-bin "$PGBIN/psql" --failures "${files[@]}"
      # S-0.13 (DAN-726): the migration tests in tests/db, ported from Ductus
      # tests/integration, need the database of the Ductus local stack and CI:
      # 127.0.0.1:54329, database and superuser ductus with the public
      # local-only password of Ductus compose.yaml (no secret). A second
      # cluster of the same PostgreSQL 17, so the pgTAP smoke test above keeps
      # its own. The roles come from db/main/local/migrator.sql, then every
      # migration runs through the locked runner as ductus_migrator, as Ductus
      # `pnpm db:migrate` does.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Baza za migracije
        env:
          MAIN_PASSWORD: ductus-local-only
        run: |
          printf '%s\n' "$MAIN_PASSWORD" > "$RUNNER_TEMP/main-password"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/main-data" -U ductus --pwfile="$RUNNER_TEMP/main-password" \
            --auth-local=trust --auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/main-data" -l "$RUNNER_TEMP/main.log" -w start \
            -o "-p 54329 -k $RUNNER_TEMP -c listen_addresses=127.0.0.1"
          "$PGBIN/psql" "postgres://ductus:$MAIN_PASSWORD@127.0.0.1:54329/postgres" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE ductus'
      - name: Uloge i migracije (migrate-locked)
        env:
          DATABASE_URL: postgres://ductus:ductus-local-only@127.0.0.1:54329/ductus
        run: |
          "$PGBIN/psql" "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/main/local/migrator.sql
          node scripts/db/migrate-locked.ts --url "$DATABASE_URL?sslmode=disable&role=ductus_migrator"
          # S-0.17 (DAN-730): the local login of the web process, ductus_app_local
          # (APP_DATABASE_URL of the database project in vitest.config.ts), as
          # Ductus `pnpm db:migrate` provisions it. The file refuses TCP, so it
          # runs over this cluster's socket.
          "$PGBIN/psql" -h "$RUNNER_TEMP" -p 54329 -U ductus -d ductus -v ON_ERROR_STOP=1 -q -f db/main/local/app-login.sql
          applied="$("$PGBIN/psql" "$DATABASE_URL" -tAc 'SELECT count(*) FROM public.schema_migrations')"
          files="$(find db/main/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          echo "Primijenjeno $applied od $files migracija."
          [ "$applied" -eq "$files" ]
      # S-0.14 (DAN-727): `pnpm db:up:native` brings the main database up
      # natively, as on a developer machine, on its own cluster of the
      # runner user (socket as superuser, loopback TCP with SCRAM), twice: the
      # second run must change nothing. Then the roles it made are compared
      # with the Ductus list (tests/db/local-roles.integration.test.ts, in
      # pnpm test:database).
      - name: Lokalni stog, nativno (pnpm db:up:native)
        run: |
          echo "DUCTUS_NATIVE_PGSOCKET=$RUNNER_TEMP" >> "$GITHUB_ENV"
          export DUCTUS_NATIVE_PGSOCKET="$RUNNER_TEMP"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/native-data" -U "$(id -un)" \
            --auth-local=trust --auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/native-data" -l "$RUNNER_TEMP/native.log" -w start \
            -o "-p $DUCTUS_NATIVE_PGPORT -k $RUNNER_TEMP -c listen_addresses=127.0.0.1"
          PATH="$PGBIN:$PATH" pnpm db:up:native
          PATH="$PGBIN:$PATH" pnpm db:up:native
      - name: Testovi migracija
        env:
          DATABASE_URL: postgres://ductus:ductus-local-only@127.0.0.1:54329/ductus
        run: pnpm test:database
      # S-0.15 (DAN-728): the pgTAP matrix ported from Ductus db/tests
      # (db/main/tests) against the migrated and provisioned native main
      # database from `pnpm db:up:native` above, as Ductus runs
      # `pg_prove --recurse --ext .sql` after `pnpm db:migrate`. The smoke step
      # above globs only db/tests, so the matrix never runs on its empty database.
      - name: pgTAP glavne baze (pnpm test:db:native)
        run: PATH="$PGBIN:$PATH" pnpm test:db:native

  ci-ok:
    name: ci-ok
    needs: [scope, checks, database]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Zbirna provjera
        env:
          PROFILE: ${{ needs.scope.outputs.profile }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ -f scripts/ci/ci-ok.ts ] && [ ! -L scripts/ci/ci-ok.ts ]; then
            printf '%s' "$NEEDS" | node scripts/ci/ci-ok.ts
          else
            printf '%s' "$NEEDS" | jq -e 'length == 3 and all(.[]; .result == "success")'
          fi
