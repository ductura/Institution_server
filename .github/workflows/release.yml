name: Automatsko izdanje

# DAN-804: after every push to main, release:level compares each package staged
# at its last tag with HEAD (scripts/release/level.ts). A minor or patch gets a
# tag on this commit and publish.yml is dispatched on that tag (a tag pushed by
# GITHUB_TOKEN starts no workflow). A major, or anything that cannot be
# classified, is reported on the merged PR and stops. Only level runs code of
# this repository, and it only reads; tag and report run only gh.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  level:
    name: Razina izdanja
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.level.outputs.releases }}
      stopped: ${{ steps.level.outputs.stopped }}
    steps:
      # fetch-depth 0: the tags and their commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Određivanje razine
        id: level
        run: pnpm release:level

  tag:
    name: Oznaka i objava
    needs: level
    if: needs.level.outputs.releases != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      # Only on the tip of main: a later run covers this commit as well.
      # POST git/refs never moves a tag; one that exists fails the job.
      - name: Oznaka
        env:
          RELEASES: ${{ needs.level.outputs.releases }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          tip="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$tip" != "$SHA" ]; then echo "::notice::main moved on; a later run releases"; exit 0; fi
          for tag in $RELEASES; do
            [[ "$tag" =~ ^(contracts|test-fakes)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA" > /dev/null
            gh api -X POST "repos/$REPO/actions/workflows/publish.yml/dispatches" -f "ref=$tag"
          done

  report:
    name: Izdanje čeka vlasnika
    needs: level
    if: needs.level.outputs.stopped != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A fixed text: nothing from the diff reaches the comment.
      - name: Komentar na spojeni PR
        env:
          STOPPED: ${{ needs.level.outputs.stopped }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN" =~ ^[0-9]+$ ]]
          [[ "$STOPPED" =~ ^(contracts|test-fakes):(major|blocked)( (contracts|test-fakes):(major|blocked))?$ ]]
          body="Automatsko izdanje je stalo ($STOPPED): major ili neodređena razina traži vlasnikovu odluku. Razlozi: https://github.com/$REPO/actions/runs/$RUN"
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // ""')"
          if [[ "$pr" =~ ^[0-9]+$ ]]; then
            gh api -X POST "repos/$REPO/issues/$pr/comments" -f "body=$body" > /dev/null
          fi
          echo "::error::$body"
          exit 1
