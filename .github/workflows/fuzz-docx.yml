name: Fuzz DOCX uvoz

# ISTR-8: Jazzer.js nad readDocx (server/import/docx). Samo ručno pokretanje;
# nije u ci-ok i ne blokira spajanje. Svaki pad postaje regresijski test u
# server/import/docx/fuzz-regressions.test.ts (fuzz/docx/README.md).
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Ukupno trajanje fuzzanja u sekundama"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-docx
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fuzz-docx:
    name: Jazzer.js, DOCX uvoz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalacija Jazzer.js (točan lockfile, izvan workspacea)
        run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: fuzz/docx
      - name: Fuzz
        env:
          SECONDS_TOTAL: ${{ inputs.seconds }}
        run: node fuzz/docx/run.ts "$SECONDS_TOTAL"
      - name: Ulazi koji su srušili uvoz
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-docx-crashes
          path: |
            fuzz/docx/dist/crash-*
            fuzz/docx/dist/timeout-*
            fuzz/docx/dist/oom-*
          if-no-files-found: ignore
