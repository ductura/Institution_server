name: Objava paketa

# U10-b (DAN-742): publishes @ductura/contracts or @ductura/test-fakes to
# GitHub Packages when a tag contracts-vX.Y.Z or test-fakes-vX.Y.Z is pushed
# (DAN-866: release.yml pushes it with the release deploy key, and that push
# starts this workflow once); the published version is the tag's.
# verify reads only: it checks the tag (scripts/release/tag.ts), packs the
# package and runs the whole U10-a check over the unpacked tarball. publish is
# the only job that may write packages; it runs no code of this repository,
# only checks the sha256 of verify's tarball and publishes that file.
# The tag name never enters a run block through an expression.
on:
  push:
    tags: ["contracts-v*.*.*", "test-fakes-v*.*.*"]
  # DAN-804: a manual run on a tag (DAN-866: release.yml no longer dispatches,
  # its pushed tag starts this workflow). No inputs; release:tag refuses any
  # ref that is not refs/tags/<name>, a branch included.
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Provjera izdanja
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      file: ${{ steps.tarball.outputs.file }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      # fetch-depth 0: tag.ts needs origin/main to see that the commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release builds from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The tag first, before any test or check code runs.
      - name: Provjera oznake
        id: tag
        run: pnpm release:tag
      - name: Provjera tipova
        run: pnpm typecheck
      - name: Unit testovi
        run: pnpm test:unit
      - name: Integracijski testovi
        run: pnpm test:integration
      - name: Provjera paketa
        run: pnpm release:check
      - name: Tarball i njegova provjera
        id: tarball
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: pnpm release:tarball "$PACKAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: dist/release/tarball/${{ steps.tarball.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Objava na GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: packages
    permissions:
      contents: read
      packages: write
    steps:
      # No checkout here, so no .nvmrc: the same version, checked by workflow.test.ts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@ductura"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: release
      - name: Provjera sha256
        env:
          FILE: ${{ needs.verify.outputs.file }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
        # Without `shell:` GitHub runs `bash -e {0}`: no pipefail of its own (DAN-866).
        run: |
          set -o pipefail
          [[ "$FILE" =~ ^ductura-(contracts|test-fakes)-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(find release -type f | wc -l)" -eq 1 ]
          printf '%s  %s\n' "$SHA256" "release/$FILE" | sha256sum --check --strict -
      # "./": npm reads a bare release/x.tgz as the GitHub shorthand owner/repo (DAN-742).
      - name: Objava
        env:
          FILE: ${{ needs.verify.outputs.file }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts "./release/$FILE"
