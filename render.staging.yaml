# Render Blueprint for the STAGING of Institution_server (docs/STAGING.md).
# Created in Render by hand (New -> Blueprint, Blueprint path
# render.staging.yaml); production stays in render.yaml. Staging is built from
# the migration branch, not from main (owner decision 23. 11. 2026., Ductus#2055
# c.7101552311). The image is the same production stage of infra/web/Dockerfile:
# no target, so the test-server stage never reaches Render (D-09). Only names are
# here: every value is entered by hand in the Render Dashboard (sync: false).
# Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ductura-institution-server-staging
    runtime: docker
    region: frankfurt
    branch: migracija/kopija-ductus-backend
    # A push to the branch never deploys by itself: the migrations are run by
    # hand first (docs/STAGING.md), and every deploy is Daniel's word.
    autoDeployTrigger: "off"
    dockerfilePath: ./infra/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # The staging switch of STG-PRIJAVA: the only way the production build
      # takes the fake OIDC provider, and never with a production APP_ORIGIN.
      - key: DUCTURA_DEPLOYMENT
        sync: false
      # Origin of the staging front on Vercel (never ductura.org).
      - key: APP_ORIGIN
        sync: false
      # Logins made by hand (docs/STAGING.md), never the owner URL Render shows.
      - key: APP_DATABASE_URL
        sync: false
      - key: AUTH_DATABASE_URL
        sync: false
      - key: LOGS_DATABASE_URL
        sync: false
      # Left empty on staging until the legal database can be provisioned
      # without a superuser (docs/STAGING.md, "Otvoreno").
      - key: LEGAL_DATABASE_URL
        sync: false
      - key: TRUSTED_PROXIES
        sync: false
      - key: DUCTUS_AUTH_PROVIDER
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: OIDC_POST_LOGOUT_REDIRECT_URI
        sync: false
      # Its own value, never the one of production.
      - key: DUCTURA_PROVISIONING_TOKEN
        sync: false
      # Left empty on staging: no storage provider is chosen (D-08).
      - key: EVIDENCE_STORAGE_DOMAINS
        sync: false

  # The fake OIDC provider of the staging (STG-OIDC; owner decision of
  # 23. 11. 2026., "Idemo B"): its own service, never a route of the server
  # (U9). The image fixes DUCTURA_DEPLOYMENT=staging, so it starts only with a
  # public issuer outside ductura.org, every redirect on APP_ORIGIN and the two
  # secrets below (packages/test-fakes/oidc/staging.ts). Its address is
  # OIDC_ISSUER of the server. Replaced by AAI@EduHr (a) by changing only
  # DUCTUS_AUTH_PROVIDER and OIDC_* of the server (docs/STAGING.md).
  - type: web
    name: ductura-fake-oidc-staging
    runtime: docker
    region: frankfurt
    branch: migracija/kopija-ductus-backend
    autoDeployTrigger: "off"
    dockerfilePath: ./infra/fake-oidc/Dockerfile
    dockerContext: .
    healthCheckPath: /.well-known/openid-configuration
    envVars:
      # The staging front on Vercel, the same value as APP_ORIGIN of the server.
      - key: APP_ORIGIN
        sync: false
      # This service's own address, e.g. https://ductura-fake-oidc-staging.onrender.com.
      - key: ISSUER
        sync: false
      # The same value as OIDC_CLIENT_SECRET of the server; at least 32 characters.
      - key: FAKE_OIDC_CLIENT_SECRET
        sync: false
      # Signs the provider's cookies; its own value, at least 32 characters.
      - key: FAKE_OIDC_COOKIE_KEY
        sync: false

databases:
  # Main database (ductus). ductus_legal would live in this instance too
  # (db/legal/local/create-database.sql).
  - name: ductura-institution-db-staging
    region: frankfurt
    databaseName: ductus
    postgresMajorVersion: "17"
  - name: ductura-institution-logs-db-staging
    region: frankfurt
    databaseName: ductus_logs
    postgresMajorVersion: "17"
